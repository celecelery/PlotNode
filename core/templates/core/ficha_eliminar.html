{% extends "app_base.html" %}
{% block titulo %}Eliminar ficha{% endblock %}
{% block contenido %}
<div class="hoja hoja-cuenta hoja-lateral">
  <h1>¿Eliminar la ficha de {{ ficha.nombre }}?</h1>
  <p class="entrada">Se borrarán también sus atributos. Tu texto no cambia. <strong>No se puede deshacer.</strong></p>
  <form method="post">{% csrf_token %}
    <div class="acciones"><button class="boton boton-coral" type="submit">Sí, eliminar ficha</button><a href="{% url 'fichas_lista' proyecto.pk %}">Cancelar</a></div>
  </form>
</div>
{% endblock %}
