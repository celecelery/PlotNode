{% extends "base.html" %}
{% block titulo %}Crear cuenta{% endblock %}
{% block contenido %}
<div class="angosto">
  <div class="tarjeta">
    <h1>Crear cuenta</h1>
    <p class="sutil">Gratis. Tus historias se guardan en tu cuenta y solo tú puedes verlas.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.non_field_errors }}
      {{ form.as_p }}
      <div class="acciones"><button class="boton" type="submit">Crear cuenta</button></div>
    </form>
  </div>
  <p class="sutil pequeno" style="text-align:center">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
</div>
{% endblock %}
