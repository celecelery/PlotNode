{% extends "base.html" %}
{% block titulo %}Recuperar contraseña{% endblock %}
{% block contenido %}
<div class="angosto"><div class="tarjeta">
  <h1>Recuperar contraseña</h1>
  <p class="sutil">Escribe el correo de tu cuenta y te enviaremos un enlace para crear una nueva contraseña.</p>
  <form method="post">{% csrf_token %}{{ form.as_p }}
    <div class="acciones"><button class="boton" type="submit">Enviar enlace</button><a href="{% url 'login' %}">Volver</a></div>
  </form>
</div></div>
{% endblock %}
