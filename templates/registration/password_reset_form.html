{% extends "base.html" %}
{% block titulo %}Recuperar contraseña{% endblock %}
{% block contenido %}
<div class="hoja hoja-cuenta">
  <h1>Recuperar contraseña</h1>
  <p class="entrada">Escribe el correo de tu cuenta y te enviaremos un enlace para crear una contraseña nueva.</p>
  <form method="post" class="formulario">{% csrf_token %}{{ form.as_p }}
    <div class="acciones"><button class="boton" type="submit">Enviar enlace</button><a href="{% url 'login' %}">Volver a iniciar sesión</a></div>
  </form>
</div>
{% endblock %}
