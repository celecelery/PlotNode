{% extends "base.html" %}
{% block titulo %}Nueva contraseña{% endblock %}
{% block contenido %}
<div class="angosto"><div class="tarjeta">
  {% if validlink %}
    <h1>Nueva contraseña</h1>
    <form method="post">{% csrf_token %}{{ form.as_p }}
      <div class="acciones"><button class="boton" type="submit">Guardar contraseña</button></div>
    </form>
  {% else %}
    <h1>Enlace no válido</h1>
    <p>El enlace ya se usó o expiró. Solicita uno nuevo.</p>
    <a class="boton" href="{% url 'password_reset' %}">Solicitar enlace</a>
  {% endif %}
</div></div>
{% endblock %}
